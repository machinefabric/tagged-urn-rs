# The Rust this crate's matching runs is generated from the proved model in
# ../formal (Lean) by `cargo lungo build`, and checked in under src/generated:
# a crate that compiles this one needs the `lungo` runtime and never Lean.
# Regenerate after changing the model with scripts/generate-formal.sh, and the
# test `formal_generated_code_is_current` fails when the checked-in copy drifts.
project = "../formal"

[build]
root-modules = ["TaggedUrn.Exec"]
export-modules = ["TaggedUrn.Exec"]
out-dir = "src/generated"
deny-sorry = true
deny-axioms = true
deny-unsafe = true
